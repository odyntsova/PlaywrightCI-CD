# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Install powershell
      uses: cakhanif/action-install-powershell@v1
    - name: Install Playwright browsers
      run: pwsh ${{ github.workspace }}/EaApplicationTest/bin/Debug/net10.0/playwright.ps1 install --with-deps
    - name: Start containers
      run: docker compose -f ${{ github.workspace }}/docker-compose.yml up -d ea_api ea_webapp
    - name: Test
      working-directory: ${{ github.workspace }}/EaApplicationTest
      run: dotnet test --no-build --verbosity normal
    - name: Stop containers
      if: always()
      run: docker compose -f ${{ github.workspace }}/docker-compose.yml down
